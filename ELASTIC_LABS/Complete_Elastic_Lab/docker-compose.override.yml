services:
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: fleet-server
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_URL=https://fleet-server:8220
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://es01:9200
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN}
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_CERT=/certs/fleet.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet.key
      - FLEET_CA=/certs/fleet.crt
      - FLEET_SERVER_HOST=0.0.0.0
    ports:
      - "8220:8220"
    volumes:
      - ./fleet-certs:/certs:ro
    mem_limit: 1g
